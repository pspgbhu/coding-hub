appId: dev.codinghub.desktop
productName: Coding Hub
extraMetadata:
  releaseChannel: internal
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - build/*.png
  - build/licenses/*
  - package.json
  - '!node_modules/@anthropic-ai/claude-agent-sdk-*/**/*'
  - '!node_modules/monaco-editor/**/*'
asar: true
afterExtract: scripts/native-deps.cjs
asarUnpack:
  - '**/*.node'
  - '**/node-pty/**'
  - '**/@anthropic-ai/**'
mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
win:
  icon: build/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
