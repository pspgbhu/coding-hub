name: 故障报告
description: 报告可以复现的桌面流程、CLI、文件、Git 或恢复问题。
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: |
        请使用脱敏的最小复现。不要附账号 token、证书、私钥、完整数据库或未经核对的原始 CLI 日志。
        此表单不会自动上传诊断；提交前请人工检查内容。
  - type: input
    id: version
    attributes:
      label: 应用版本与构建来源
      placeholder: 例如 0.1.1 / 源码提交 / 内部包 / 签名候选
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 系统与架构
      options:
        - macOS x64（Intel）
        - macOS arm64（Apple Silicon）
        - 原生 Windows x64
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统版本与相关 CLI 版本
      placeholder: 例如 macOS 版本；Codex CLI --version；不包含凭据
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 说明共享目录或独立 worktree、受限或可信项目，以及是否有运行任务 / 外部编辑。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已核对的诊断片段或截图
      description: 可在数据设置中主动导出诊断；脱敏不能识别所有自定义秘密，请先人工检查。
  - type: textarea
    id: recovery
    attributes:
      label: 已尝试的恢复与数据影响
      description: 例如重新检测、停止重试、重新打开窗口；请说明草稿 / 文件是否仍在，避免为复现删除原数据。
