name: Desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm benchmark --desktop
      - run: pnpm test:e2e
      - run: pnpm exec electron-builder --mac --${{ matrix.arch }} --publish never
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm exec electron-builder --win --publish never
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test the packaged application
        run: node scripts/packaged-e2e.mjs
      - name: Build pinned native 0.1.0 installer outside the current checkout
        id: installation-baseline
        run: node scripts/build-install-baseline.mjs
        env:
          CODING_HUB_INSTALL_SMOKE: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Native macOS install, old-version upgrade and retained-data uninstall
        if: runner.os == 'macOS'
        run: |
          node scripts/macos-install-smoke.mjs --old-dmg "$OLD_INSTALLER" --new-dmg "$NEW_INSTALLER" --output "coverage/installation/macos-${{ matrix.arch }}.json"
          node scripts/build-install-baseline.mjs --verify-report "coverage/installation/macos-${{ matrix.arch }}.json"
        env:
          OLD_INSTALLER: ${{ steps.installation-baseline.outputs.old_installer }}
          NEW_INSTALLER: ${{ steps.installation-baseline.outputs.new_installer }}
          CODING_HUB_INSTALL_SMOKE: '1'
      - name: Native NSIS install, old-version upgrade and retained-data uninstall
        if: runner.os == 'Windows'
        run: |
          node scripts/windows-install-smoke.mjs --old-installer "$env:OLD_INSTALLER" --new-installer "$env:NEW_INSTALLER" --output coverage/installation/windows-x64.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/build-install-baseline.mjs --verify-report coverage/installation/windows-x64.json
        env:
          OLD_INSTALLER: ${{ steps.installation-baseline.outputs.old_installer }}
          NEW_INSTALLER: ${{ steps.installation-baseline.outputs.new_installer }}
          CODING_HUB_INSTALL_SMOKE: '1'
      - name: Remove only the owned historical installer fixture
        if: always() && steps.installation-baseline.outputs.root != ''
        run: node scripts/build-install-baseline.mjs --cleanup
        env:
          CODING_HUB_BASELINE_ROOT: ${{ steps.installation-baseline.outputs.root }}
          CODING_HUB_INSTALL_SMOKE: '1'
      - name: Installer checksums
        run: node scripts/checksums.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            test-results/
            playwright-report/
            coverage/benchmarks/
            coverage/installation/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: coding-hub-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/SHA256SUMS.txt
          retention-days: 30
