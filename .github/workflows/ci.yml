name: Desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm exec electron-builder --mac --publish never
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm exec electron-builder --win --publish never
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: coding-hub-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          retention-days: 7
