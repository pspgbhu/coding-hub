name: Desktop checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
          - os: windows-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm benchmark --desktop
      - run: pnpm test:e2e
      - run: pnpm exec electron-builder --mac --${{ matrix.arch }} --publish never
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: pnpm exec electron-builder --win --publish never
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test the packaged application
        run: node scripts/packaged-e2e.mjs
      - name: Installer checksums
        run: node scripts/checksums.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            test-results/
            playwright-report/
            coverage/benchmarks/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: coding-hub-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/SHA256SUMS.txt
          retention-days: 30
